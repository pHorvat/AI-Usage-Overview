name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave empty to run checks only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  core-tests:
    name: Build and run core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Run core tests
        run: .\build\test.bat -CoreOnly

  release:
    name: Build and publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: core-tests
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content CodexUsageNotch.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match project version $version."
          }
      - name: Build both Windows executables
        shell: pwsh
        run: .\build\build-release.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG .\CodexUsageNotch.exe .\CodexUsageNotch-lite.exe --verify-tag --generate-notes --title $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }
